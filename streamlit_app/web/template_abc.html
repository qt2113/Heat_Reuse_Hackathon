<style>
/* Same visual identity as the original visualizer (dark theme, Space Grotesk / IBM Plex), refined into a map -> radar -> flip-card story. */

.mapbox { position: relative; overflow: hidden; padding: 0 }

  border-radius: 10px; padding: 7px 11px; font-size: .78rem; display: flex; gap: 14px; flex-wrap: wrap; max-width: calc(100% - 24px); align-items: center }

.pop { position: absolute; top: 12px; right: 12px; width: min(330px, calc(100% - 24px)); max-height: calc(100% - 24px); overflow: auto; background: var(--surface);
  border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: grid; gap: 10px; box-shadow: 0 12px 34px rgba(0,0,0,.5); z-index: 6 }

  background: radial-gradient(120% 90% at 50% 0%, color-mix(in srgb, var(--ac) 20%, var(--surface)) 0%, var(--surface) 62%); overflow: hidden }

@keyframes pulse { 0%, 100% { opacity: .55 } 50% { opacity: 1 } }

.a-fill { animation: fillup 5s ease-in-out infinite alternate } .a-wave { animation: wave 2.4s linear infinite } .a-shine { animation: shine 4s ease-in-out infinite } .a-lit { animation: lit 3.2s ease-in-out infinite }

.flowrow { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-around; gap: 8px; padding: 16px }
.flowrow .step { display: grid; justify-items: center; text-align: center; gap: 4px; flex: 1 1 130px; min-width: 0 } .flowrow .big { font: 600 1.4rem var(--font-data) }
.flowrow .big.t { font: 600 1rem var(--font-display) } .flowrow .arrow { color: var(--muted); font-size: 1.4rem } .small { font-size: .8rem }
.cards3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 12px; margin-top: 12px }
.two2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; margin-top: 12px } .two2 > * { min-width: 0 }
.card { padding: 14px 16px } .pcard { padding: 14px 16px; display: grid; gap: 8px; align-content: start }
.eyebrow { font-size: .74rem; letter-spacing: .08em; text-transform: uppercase; color: var(--heat); font-weight: 600 }
.pbar, .rbar { display: grid; grid-template-columns: 104px 1fr 48px; gap: 8px; align-items: center; font-size: .85rem } .rbar { grid-template-columns: minmax(120px, 210px) 1fr 40px }
.pbar .num, .rbar .num { text-align: right }
.bar { height: 10px; border-radius: 5px; background: var(--line) } .bar > i { display: block; height: 100%; border-radius: 5px }
.ba { display: grid; grid-template-columns: 1fr auto auto auto; gap: 8px; align-items: baseline }
.key { display: flex; flex-wrap: wrap; gap: 14px; font-size: .82rem } .key .sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px }
.impact { padding: 16px 18px; display: grid; gap: 8px; align-content: start } .impact .label { font-size: .85rem; color: var(--muted) }
.impact .hero-num { font: 600 clamp(1.8rem, 3.4vw, 2.4rem)/1.1 var(--font-data) } .impact details summary { cursor: pointer; color: var(--muted); font-size: .82rem } .impact details p { font-size: .84rem; color: var(--muted); margin-top: 6px }
.share { display: flex; height: 14px; border-radius: 7px; overflow: hidden; background: var(--line) } .share i { display: block; height: 100% }
.pictos { display: flex; flex-wrap: wrap; gap: 2px; align-items: center }
.preview-note { font-size: .8rem; color: var(--warn); border: 1px solid color-mix(in srgb, var(--warn) 45%, var(--line)); border-radius: 10px; padding: 6px 12px; background: color-mix(in srgb, var(--warn) 7%, var(--surface)) }
</style>

<div id="root"></div>
<script id="data" type="application/json">/*__DATA__*/null</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script>
document.documentElement.setAttribute("data-theme", "dark");
const DATA = JSON.parse(document.getElementById("data").textContent);   // the teammate's exported results (web/data.json), unchanged
const { useState, useMemo, useRef, useEffect, useLayoutEffect } = React;
const html = htm.bind(React.createElement);
const SCN = DATA.scenarios, B = DATA.buildings, site = DATA.site;
const DEFAULT_KEY = "realistic";
const f = {
  int: v => Math.round(v).toLocaleString("en-US"), gwh: v => (v / 1000).toFixed(2),
  usdM: v => (v < 0 ? "−$" : "$") + Math.abs(v / 1e6).toFixed(2) + "M", usd: v => (v < 0 ? "−$" : "$") + Math.round(Math.abs(v)).toLocaleString("en-US"),
};
const KIND_LABEL = { datacenter: "Data center", school: "School", residential: "Residential housing", hotel: "Hotel", office: "Office / commercial", other: "Other building" };
const RES = new Set(DATA.consts.residential_types);
function kindOf(t) {
  if (RES.has(t) || t === "Residential Care Facility") return "residential";
  if (t === "K-12 School" || t === "College/University") return "school";
  if (t === "Hotel") return "hotel";
  if (["Office", "Medical Office", "Retail Store", "Mixed Use Property", "Other - Technology/Science", "Urgent Care/Clinic/Other Outpatient", "Fitness Center/Health Club/Gym"].includes(t)) return "office";
  return "other";
}
const clean = n => n.replace(/^(DEPM\s*\d+\s*-\s*|\(\d+\)\s*-\s*|Orsid\s*-\s*)/, "");
const short = (n, len = 26) => { const c = clean(n); return c.length > len ? c.slice(0, len - 1) + "…" : c; };
const REASON_LABEL = { 1: "Its current heat is already cheaper", 2: "Too costly to reach", 3: "Heat supply already used", 4: "Not in the fixed design", 5: "Screened out" };

/* ---------------- building icons ---------------- */
function Glyph({ kind }) {
  const s = { fill: "none", stroke: "#fff", strokeWidth: 1.7, strokeLinecap: "round", strokeLinejoin: "round" };
  const g = {
    datacenter: html`<g ...${s}><rect x="5" y="4" width="14" height="5" rx="1"/><rect x="5" y="10" width="14" height="5" rx="1"/><rect x="5" y="16" width="14" height="4" rx="1"/><path d="M8 6.5h.01M8 12.5h.01M8 18h.01"/></g>`,
    school: html`<g ...${s}><path d="M3 10l9-5 9 5"/><path d="M5 10v9h14v-9"/><path d="M10 19v-5h4v5"/><path d="M12 5V2.5h3"/></g>`,
    residential: html`<g ...${s}><rect x="6" y="3" width="12" height="17" rx="1"/><path d="M9.5 7h.01M14.5 7h.01M9.5 11h.01M14.5 11h.01M9.5 15h.01M14.5 15h.01"/></g>`,
    hotel: html`<g ...${s}><path d="M4 19V8M4 14h16v5M20 14v-2.5A2.5 2.5 0 0017.5 9H11v5"/><circle cx="7.5" cy="11" r="1.6"/></g>`,
    office: html`<g ...${s}><path d="M7 20V6l7-3v17M14 9h4v11M5 20h14"/><path d="M10 8h.01M10 12h.01M10 16h.01"/></g>`,
    other: html`<g ...${s}><path d="M3 9l9-5 9 5M5 9v9M9.5 9v9M14.5 9v9M19 9v9M3 20h18"/></g>`,
  };
  return g[kind] || g.other;
}
function Badge({ kind, r = 14, fill = "var(--good)", ring = "var(--bg)", glow = false }) {
  const sc = r / 12;
  return html`<g>${glow ? html`<circle r=${r + 6} fill=${fill} opacity=".25" />` : null}
    <circle r=${r} fill=${fill} stroke=${ring} strokeWidth="2" /><g transform=${`scale(${sc * 0.72}) translate(-12,-12)`}><${Glyph} kind=${kind} /></g></g>`;
}

/* ---------------- skyline ---------------- */
const SLOTS = [[10,38,56],[52,50,38],[110,34,88,"FULTON","Fulton Houses"],[150,34,66,"FULTON"],[190,34,88,"FULTON"],[232,26,60],[264,120,40,"CHELSEA MARKET","Chelsea Market"],
  [390,26,72],[572,30,50],[608,44,96,"212 WEST 18TH","212 W 18th St"],[658,50,62],[714,28,84],[750,46,44],[802,34,70],[842,70,68,"155 WEST 11TH","155 W 11th St"],[918,30,52],[954,44,80],[1004,56,46],[1066,32,64],[1104,44,36],[1152,40,58]];
const FAR = [[70,40,80],[300,50,96],[520,30,120],[690,44,104],[880,40,92],[1120,50,86]];
const GROUND = 150, DCX = 424, DCW = 140, W = 1200;
function Skyline({ names }) {
  const up = names.map(n => n.toUpperCase());
  const namedOn = SLOTS.map(s => s[3] ? up.some(n => n.includes(s[3])) : false);
  const hit = new Set(SLOTS.filter((s, i) => s[3] && namedOn[i]).map(s => s[3]));
  const others = up.filter(n => ![...hit].some(k => n.includes(k))).length;
  const centre = DCX + DCW / 2;
  const generic = SLOTS.map((s, i) => i).filter(i => !SLOTS[i][3]).sort((a, b) => Math.abs(SLOTS[a][0] + SLOTS[a][1] / 2 - centre) - Math.abs(SLOTS[b][0] + SLOTS[b][1] / 2 - centre));
  const on = new Set([...SLOTS.map((s, i) => namedOn[i] ? i : -1).filter(i => i >= 0), ...generic.slice(0, others)]);
  return html`<svg className="skyline" viewBox=${`0 0 ${W} ${GROUND + 14}`} role="img" aria-label=${`Skyline: ${names.length} buildings connected to 111 8th Ave, shown in green`}>
    ${FAR.map(([x, w, h], i) => html`<rect key=${"f" + i} x=${x} y=${GROUND - h} width=${w} height=${h} fill="currentColor" fillOpacity=".06" />`)}
    ${SLOTS.map(([x, w, h, , label], i) => html`<g key=${"s" + i}><rect x=${x} y=${GROUND - h} width=${w} height=${h} fill=${on.has(i) ? "var(--good)" : "currentColor"} fillOpacity=${on.has(i) ? .95 : .16} />
      ${label ? html`<text className="sk-label" x=${x} y=${GROUND - h - 6}>${label}</text>` : null}</g>`)}
    ${[[0, DCW, 104], [12, DCW - 24, 118], [28, DCW - 56, 130]].map(([dx, w, h], i) => html`<rect key=${"d" + i} x=${DCX + dx} y=${GROUND - h} width=${w} height=${h} fill="var(--dc)" />`)}
    <text className="sk-label sk-strong" x=${DCX + 20} y=${GROUND - 138}>111 8th Ave · data center</text>
    <rect x="0" y=${GROUND} width=${W} height="10" fill="currentColor" fillOpacity=".2" />
  </svg>`;
}

/* ---------------- derived data (everything is computed from the teammate's fields, nothing added) ---------------- */
const hav = ([a, b], [c, d]) => { const R = 6371000, r = Math.PI / 180, x = (d - b) * r * Math.cos((a + c) / 2 * r), y = (c - a) * r; return R * Math.hypot(x, y); };
const keyOf = p => p[0].toFixed(5) + "," + p[1].toFixed(5);
function pipeFlows(s) {   // heat carried by each pipe edge: sum of the heat served to every building downstream of it (tree rooted at the data center)
  const adj = new Map(), pos = new Map();
  s.pipes.forEach(line => line.forEach((p, i) => { pos.set(keyOf(p), p); if (i) { const a = keyOf(line[i - 1]), b = keyOf(p); (adj.get(a) || adj.set(a, new Set()).get(a)).add(b); (adj.get(b) || adj.set(b, new Set()).get(b)).add(a); } }));
  const nearest = ll => { let best = null, bd = 1e9; pos.forEach((p, k) => { const d = hav(p, ll); if (d < bd) { bd = d; best = k; } }); return best; };
  const root = keyOf(s.pipes[0][0]), load = new Map();

/* How we choose the route */
function RouteLogic({ s }) {
  const sc = s.scores, chosen = s.connected.map(c => c.i).sort((a, b) => sc.score[b] - sc.score[a]);
  const idx = B.map((_, i) => i).filter(i => sc.score[i] !== null);
  const near = idx.filter(i => [2, 3, 4].includes(sc.reason[i])).sort((a, b) => sc.score[b] - sc.score[a]).slice(0, 3);
  const cheap = idx.filter(i => sc.reason[i] === 1).sort((a, b) => B[b].mwh - B[a].mwh).slice(0, 3);
  const rows = [...chosen.slice(0, 5), ...near, ...cheap];
  const vals = rows.map(i => sc.score[i]), lo = Math.min(0, ...vals), hi = Math.max(0, ...vals);
  const x = d3.scaleLinear().domain([lo, hi]).nice().range([190, 520]), rowH = 26, h = rows.length * rowH + 26;
  const counts = [1, 2, 3, 4, 5].map(r => [r, sc.reason.filter(v => v === r).length]).filter(([, n]) => n > 0);
  const skipped = counts.reduce((t, [, n]) => t + n, 0), maxN = Math.max(...counts.map(([, n]) => n));
  return html`<section aria-labelledby="route-h">
    <div className="section-head"><div className="step-n">The method</div><h2 id="route-h">How we choose the route</h2><p>Each building gets a yearly score; we connect the set that is worth the most.</p></div>
    <${Flow4} color="var(--dc)" steps=${[["score", "Score every building", `${B.length} candidates`], ["grow", "Grow from the data center", "add the best next one"], ["share", "Share the limited heat", "checked every hour"], ["refine", "Re-route and refine", "until nothing improves"]]} />
    <div className="two2">
      <div className="panel card"><h3>Supplied vs skipped</h3>
        <div className="key" style=${{ margin: "6px 0" }}><span><i className="sw" style=${{ background: "var(--good)" }}></i>Supplied</span><span><i className="sw" style=${{ background: "var(--bad)" }}></i>Skipped</span></div>
        <svg viewBox=${`0 0 560 ${h}`} style=${{ width: "100%", display: "block" }} role="img" aria-label="Yearly score per building: supplied in green, skipped in red">
          <line x1=${x(0)} x2=${x(0)} y1="2" y2=${h - 18} stroke="var(--ink)" strokeOpacity=".4" />
          ${rows.map((i, k) => { const v = sc.score[i], y = 4 + k * rowH, ok = sc.reason[i] === 0;
            return html`<g key=${i}><text x="182" y=${y + 15} textAnchor="end" style=${{ font: "12.5px var(--font-body)", fill: "var(--ink)" }}>${short(B[i].n, 24)}</text>
              <rect x=${Math.min(x(0), x(v))} y=${y + 3} width=${Math.max(2, Math.abs(x(v) - x(0)))} height=${rowH - 10} rx="3" fill=${ok ? "var(--good)" : "var(--bad)"} opacity=${ok ? .95 : .7} />
              <text x=${v >= 0 ? x(v) + 6 : x(0) + 6} y=${y + 15} style=${{ font: "500 11.5px var(--font-data)", fill: "var(--muted)" }}>${fmtK(v)}</text></g>`; })}
          <text x=${x(0)} y=${h - 3} textAnchor="middle" style=${{ font: "10.5px var(--font-body)", fill: "var(--muted)" }}>score, $ per year</text></svg>
        <details style=${{ marginTop: 8 }}><summary>How the score is built</summary><p className="muted small" style=${{ marginTop: 6 }}>Score = heat value − pipe cost − connection cost, per year.
          Heat value = MWh it takes × (its current heat price − network heat price) + climate fines avoided${s.carbon_price > 0 ? "; this scenario also values carbon at $" + s.carbon_price + "/t" : ""}${s.priority_weight > 1 ? "; public housing and schools count ×" + s.priority_weight : ""}.</p></details></div>
      <div className="panel card"><h3>Why ${f.int(skipped)} buildings were skipped</h3>
        <div style=${{ display: "grid", gap: 8, marginTop: 8 }}>${counts.map(([r, n]) => html`<div key=${r} className="rbar"><span>${REASON_LABEL[r]}</span>
          <div className="bar"><i style=${{ width: (n / maxN * 100) + "%", background: r === 5 ? "var(--muted)" : "var(--bad)" }}></i></div><span className="num">${f.int(n)}</span></div>`)}</div>
        <div className="muted small" style=${{ marginTop: 8 }}>Click any grey building on the map for its own reason.</div></div>
    </div></section>`;
}

/* Impact: relatable equivalents and who gets the heat (the money, heat and CO2 totals are already on the cards above) */
function Impact({ s }) {
  const k = s.kpi, C = DATA.consts, cars = Math.max(0, k.co2_net_t / C.car_t);
  const tot = { home: 0, pub: 0, biz: 0 };
  s.connected.forEach(c => { const b = B[c.i]; tot[b.pr ? "pub" : RES.has(b.t) ? "home" : "biz"] += c.served; });
  const all = tot.home + tot.pub + tot.biz || 1;
  const parts = [["home", "Homes", "var(--dc)"], ["pub", "Public housing & schools", "var(--pilot)"], ["biz", "Businesses & institutions", "var(--muted)"]];
  const perCar = [1, 2, 5, 10, 20, 50, 100, 200, 500, 1000].find(p => cars / p <= 12) || 2000, nCar = Math.round(cars / perCar);
  return html`<section aria-labelledby="impact-h">
    <div className="section-head"><div className="step-n">The result</div><h2 id="impact-h">Impact</h2><p>${s.icon} ${s.label}: what this network means in everyday terms.</p></div>
    <div className="two2">
      <div className="panel impact"><div className="label">Climate</div><div className="hero-num">${f.int(k.co2_net_t)} t CO₂</div>
        <div className="plain">avoided per year, like taking ${f.int(cars)} cars off the road</div>
        <div className="pictos" role="img" aria-label=${`${f.int(cars)} cars`}>${Array.from({ length: nCar }, (_, j) => html`<${Ico} key=${j} name="car" color="var(--c-n)" />`)}<span className="muted small" style=${{ marginLeft: 6 }}>each = ${f.int(perCar)} cars</span></div>
        <details><summary>How we calculated this</summary><p>CO₂ of the fuel no longer burned (${f.int(k.co2_fuel_avoided_t)} t) minus CO₂ of the grid electricity used (${f.int(k.co2_grid_added_t)} t). One car emits about ${C.car_t} t a year (US EPA).</p></details></div>
      <div className="panel impact"><div className="label">Who gets the heat</div>
        <div className="hero-num">${Math.round((tot.home + tot.pub) / all * 100)}%</div><div className="plain">of delivered heat reaches homes, public housing and schools</div>
        <div className="share" aria-hidden="true">${parts.map(([g, , c]) => html`<i key=${g} style=${{ width: tot[g] / all * 100 + "%", background: c }}></i>`)}</div>
        <div className="key">${parts.map(([g, l, c]) => html`<span key=${g}><i className="sw" style=${{ background: c }}></i>${l} ${Math.round(tot[g] / all * 100)}%</span>`)}</div>
        <details><summary>About this measure</summary><p>Share of delivered heat by building group. It shows who receives the heat, not how residents feel about the project; no survey is behind it.</p></details></div>
    </div></section>`;
}

/* ---------------- details ---------------- */
function Details({ s }) {
  const [tab, setTab] = useState("b"), k = s.kpi;
  const tabs = [["b", "Buildings"], ["m", "Money"], ["c", "Compare scenarios"], ["a", "Assumptions & data"]];
  return html`<details className="panel more"><summary>Explore the details: buildings, money, all scenarios, assumptions</summary>
    <div className="tabs" role="tablist" style=${{ marginTop: 12 }}>${tabs.map(([t, l]) => html`<button key=${t} role="tab" className="tab" aria-selected=${tab === t} onClick=${() => setTab(t)}>${l}</button>`)}</div>
    <div style=${{ paddingTop: 14 }}>
    ${tab === "b" ? html`<div className="tablewrap"><table><thead><tr><th>Building</th><th>Type</th><th className="r">Demand (MWh/yr)</th><th className="r">Heat from network (MWh/yr)</th><th className="r">Its saving ($/yr)</th></tr></thead>
      <tbody>${s.connected.map(c => html`<tr key=${c.i}><td>${clean(B[c.i].n)}</td><td>${B[c.i].t}</td><td className="r num">${f.int(B[c.i].mwh)}</td><td className="r num">${f.int(c.served)}</td><td className="r num">${f.usd(c.save)}</td></tr>`)}</tbody></table></div>` : null}
    ${tab === "m" ? html`<div className="tablewrap"><table><tbody>${[["Fuel no longer bought", k.avoided_fuel_usd], ["LL97 penalties avoided (a transfer to the City)", k.avoided_ll97_usd], ["Cooling-tower water saved (unverified)", k.water_usd],
        ["Electricity (heat pump + pumps)", -k.electricity_usd], ["Pipes (annualised)", -k.capex_pipes_usd], ["Building connections", -k.capex_connections_usd], ["Heat pump", -k.capex_heat_pump_usd], ["Storage tank", -k.capex_storage_usd], ["Net", k.net_usd]].map(([l, v]) =>
        html`<tr key=${l}><td>${l}</td><td className="r num">${f.usd(v)}/yr</td></tr>`)}<tr><td>Pipe length (incl. services)</td><td className="r num">${k.pipe_km.toFixed(2)} km</td></tr></tbody></table></div>` : null}
    ${tab === "c" ? html`<div className="tablewrap"><table><thead><tr><th>Scenario</th><th className="r">Recovered GWh</th><th className="r">Delivered GWh</th><th className="r">Net CO₂ t</th><th className="r">Net value $M/yr</th><th className="r">Buildings</th></tr></thead>
      <tbody>${SCN.map(x => html`<tr key=${x.key}><td>${x.icon} ${x.label}</td><td className="r num">${f.gwh(x.kpi.recovered_heat_mwh)}</td><td className="r num">${f.gwh(x.kpi.served_mwh)}</td>
        <td className="r num">${f.int(x.kpi.co2_net_t)}</td><td className="r num">${(x.kpi.net_usd / 1e6).toFixed(2)}</td><td className="r num">${x.kpi.buildings}</td></tr>`)}</tbody></table></div>` : null}
    ${tab === "a" ? html`<div style=${{ display: "grid", gap: 10 }}>
      <div><b>What this scenario changes</b><ul>${s.changes.length ? s.changes.map((c, i) => html`<li key=${i}>${c}</li>`) : html`<li>Nothing: this is the base case.</li>`}</ul></div>
      <div className="tablewrap"><table><thead><tr><th>Assumption</th><th>Value</th><th>Unit</th><th>Source</th></tr></thead><tbody>${DATA.assumptions.map(a => html`<tr key=${a.p}><td>${a.p}</td><td className="num">${a.v}</td><td>${a.u}</td><td>${a.s}</td></tr>`)}</tbody></table></div></div>` : null}
    </div></details>`;
}

/* ---------------- app ---------------- */
function App() {
  const QS = new URLSearchParams(location.search);
  const [key, setKey] = useState(SCN.some(x => x.key === QS.get("s")) ? QS.get("s") : DEFAULT_KEY), [pick, setPick] = useState(null);
  useEffect(() => { const i = QS.get("pick"); if (i !== null) setPick({ i: +i }); }, []);
  const s = SCN.find(x => x.key === key);
  const sel = k => { setKey(k); setPick(null); };
  return html`<main className="wrap">
    <header className="panel hero"><div><span className="step-n">111 8th Avenue · Chelsea, Manhattan</span><h1>Can a data center warm its neighbours?</h1></div>
      <p className="lead">The building's servers shed heat all year. This exhibition shows where that heat could go, what it would deliver, and what it would cost. Pick a scenario, then explore.</p>
      <div className="preview-note" role="note">Design preview. Figures are the teammate's original model results (web/data.json), not our final audited A→B→C outputs.</div>
      <${Skyline} names=${s.connected.map(c => B[c.i].n)} /></header>
    <section aria-label="Map"><div className="section-head"><div className="step-n">Step 1 · Browse the map</div><h2>Where the heat goes</h2>
      <p>Click any building. Thicker, glowing pipes carry more heat; the number on a pipe is its length.</p></div>
      <div style=${{ display: "grid", gap: 12 }}><${Picker} s=${s} setKey=${sel} /><${MapView} s=${s} pick=${pick} onPick=${setPick} /></div></section>
    <section aria-label="Overall picture"><${Radar} s=${s} /></section>
    <section aria-label="Four dimensions"><div className="section-head"><div className="step-n">Step 3 · Explore the four dimensions</div><h2>${s.icon} ${s.label}: what it means</h2>
      <p>Click a card to flip it. Recovered heat, delivered heat, CO₂ avoided and money are four different things, shown separately.</p></div><${Cards} s=${s} key=${s.key} /></section>
    <${Proposal} /><${RouteLogic} s=${s} /><${Impact} s=${s} />
    <section aria-label="Details"><${Details} s=${s} /></section>
    <footer><div>Results from the teammate's heat-reuse network model (web/data.json, generated ${DATA.generated}). Street map: OpenStreetMap. LL84 energy disclosures and MapPLUTO for the buildings.</div>
      <div>Cooling-water savings and LL97 fines are shown apart from the headline figures: the first is unverified and the second is a payment, not a resource saving.</div></footer>
  </main>`;
}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
</body></html>
